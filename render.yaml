# Render Blueprint — AgroTwin full stack
# Docs: https://render.com/docs/blueprint-spec
#
# After first deploy, set frontend VITE_API_URL to the real API URL, then
# Clear build cache & redeploy agrotwin-web.

databases:
  - name: agrotwin-db
    plan: free

services:
  - type: web
    name: agrotwin-api
    runtime: docker
    dockerfilePath: ./SOFTWARE/backend/Dockerfile
    dockerContext: ./SOFTWARE/backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://agrotwin-web.onrender.com,https://agrotwin.srpskisafran.rs
      - key: DATABASE_URL
        fromDatabase:
          name: agrotwin-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: var/storage
      - key: AI_PROVIDER
        value: local
      - key: RUN_SEED
        value: "true"
      - key: YR_USER_AGENT
        value: AgroTwin/1.0 (contact@agrotwin.com)

  - type: web
    name: agrotwin-web
    runtime: static
    buildCommand: cd SOFTWARE/frontend && npm ci && npx vite build
    staticPublishPath: SOFTWARE/frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://agrotwin-api.onrender.com/api/v1
