# Automatic production publish to SuperHosting (FTPS).
#
# Absolute cPanel paths (confirmed):
#   /home/myagrotwrs/public_html
#   /home/myagrotwrs/app.myagrotwin.com
#   /home/myagrotwrs/agrotwin-api          ← Python App root (deploy target)
#   /home/myagrotwrs/api.myagrotwin.com    ← Document Root (NOT used for code deploy)
#
# Relative server-dir values below assume FTPS login home is /home/myagrotwrs/.
# Confirm with a directory listing after FTPS login before first production run.
#
# App build:
#   VITE_API_URL=https://api.myagrotwin.com/api/v1
#
# Required GitHub secrets (reuse existing):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#
# Does NOT: Alembic, pip, Passenger restart, upload var/storage,
#           or change cPanel environment variables.
# Does NOT set dangerous-clean-slate.

name: Deploy production (FTPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-ftps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            SOFTWARE/frontend/package-lock.json
            Website/package-lock.json

      - name: Install marketing website dependencies
        working-directory: Website
        run: npm ci

      - name: Build marketing website
        working-directory: Website
        run: npx vite build
        env:
          VITE_APP_URL: https://app.myagrotwin.com
          VITE_SITE_URL: https://myagrotwin.com

      - name: Install app frontend dependencies
        working-directory: SOFTWARE/frontend
        run: npm ci

      # Vite only — full `npm run build` runs tsc and currently fails on older TS debt.
      - name: Build app frontend
        working-directory: SOFTWARE/frontend
        run: npx vite build
        env:
          VITE_API_URL: https://api.myagrotwin.com/api/v1

      - name: Stage backend for upload
        run: |
          set -euo pipefail
          mkdir -p staging/api
          rsync -a \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.mypy_cache/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'var/' \
            --exclude 'tests/' \
            --exclude '*.pyc' \
            --exclude '.git/' \
            --exclude '.DS_Store' \
            SOFTWARE/backend/ staging/api/
          # Intentionally no staging/api/var — keeps server var/storage out of sync state.
          test -f staging/api/passenger_wsgi.py
          test -f staging/api/requirements.txt
          test -d staging/api/alembic/versions
          test ! -e staging/api/var

      - name: Deploy marketing website via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 600000
          local-dir: ./Website/dist/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      - name: Deploy app frontend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 600000
          local-dir: ./SOFTWARE/frontend/dist/
          server-dir: ./app.myagrotwin.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      - name: Deploy backend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 600000
          local-dir: ./staging/api/
          server-dir: ./agrotwin-api/
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/__pycache__/**
            **/.venv/**
            **/tests/**
            **/var
            **/var/**
            **/.DS_Store
