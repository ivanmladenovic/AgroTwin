# Render Blueprint — AgroTwin full stack
# Docs: https://render.com/docs/blueprint-spec
#
# After first deploy, set frontend VITE_API_URL to the real API URL, then
# Clear build cache & redeploy agrotwin-web.

databases:
  - name: agrotwin-db
    plan: free

services:
  - type: web
    name: agrotwin-api
    runtime: docker
    dockerfilePath: ./SOFTWARE/backend/Dockerfile
    dockerContext: ./SOFTWARE/backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://agrotwin-web.onrender.com,https://agrotwin.srpskisafran.rs
      - key: DATABASE_URL
        fromDatabase:
          name: agrotwin-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: var/storage
      # AI Agronom — Option A: Gemini 3.8 Flash via OpenAI-compatible endpoint
      - key: AI_PROVIDER
        value: openai_compatible
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: AI_CHAT_MODEL
        value: gemini-3.8-flash
      - key: AI_VISION_MODEL
        value: gemini-3.8-flash
      - key: AI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: AI_EMBEDDING_DIM
        value: "1536"
      # Set in Render Dashboard → agrotwin-api → Environment (Gemini API key)
      - key: AI_API_KEY
        sync: false
      - key: RUN_SEED
        value: "false"
      - key: YR_USER_AGENT
        value: AgroTwin/1.0 (contact@agrotwin.com)

  - type: web
    name: agrotwin-web
    runtime: static
    # Static sites have no compute plan — do not set `plan`.
    buildCommand: cd SOFTWARE/frontend && npm ci && npx vite build
    staticPublishPath: SOFTWARE/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://agrotwin-api-drde.onrender.com/api/v1
